name: Daily videos

on:
  schedule:
    # ONE run a night. There used to be two, at 01:00 and 02:00 UTC, on the
    # theory that the second would find the day already scheduled and stop.
    # It never did, and every slot went out twice for eight days. One cron
    # cannot double-post, whatever else breaks.
    # 01:00 UTC is 04:00 Israel in summer and 03:00 in winter — comfortably
    # before the 07:45 slot either way.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if this day was already scheduled"
        type: boolean
        default: false
      target_date:
        description: "Schedule for a specific day (YYYY-MM-DD, Israel time). Blank = automatic."
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `fonts-noto-hebrew` does NOT exist in the Ubuntu archive. Asking for it
      # made apt exit 100 and killed every nightly run for four nights before
      # anyone looked. The Hebrew glyphs live in fonts-noto-core, and even that
      # is optional: render_video.js downloads Noto Sans Hebrew itself when no
      # system font has Hebrew. So ffmpeg is the only hard requirement here.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y fonts-noto-core || echo "no noto package, the renderer will fetch the font"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Cache music beds
        uses: actions/cache@v4
        with:
          path: assets/music
          key: music-v1

      # Every cached line is a line ElevenLabs is not billed for again. The
      # closing card alone repeats in every video ever made.
      - name: Cache narration
        uses: actions/cache@v4
        with:
          path: assets/voice-cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-

      # The music lives in a separate PRIVATE repo. These are YouTube Audio
      # Library tracks: the licence covers using them inside content, not
      # redistributing the files, and this repo has to stay public so Buffer can
      # fetch the rendered MP4s. A read-only deploy key bridges the two.
      - name: Fetch the song library
        env:
          SONGS_DEPLOY_KEY: ${{ secrets.SONGS_DEPLOY_KEY }}
          SONGS_REPO: ${{ secrets.SONGS_REPO }}
        run: |
          if [ -z "$SONGS_DEPLOY_KEY" ] || [ -z "$SONGS_REPO" ]; then
            echo "no song library configured, the run will fall back to composed beds"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SONGS_DEPLOY_KEY" > ~/.ssh/songs_key
          chmod 600 ~/.ssh/songs_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/songs_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${SONGS_REPO}.git" "$RUNNER_TEMP/songs"
          rm -f ~/.ssh/songs_key
          echo "songs available: $(ls "$RUNNER_TEMP/songs"/*.mp3 2>/dev/null | wc -l)"

      - name: Preflight
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_INSTAGRAM }}
          BUFFER_CHANNEL_TIKTOK: ${{ secrets.BUFFER_CHANNEL_TIKTOK }}
          BUFFER_CHANNEL_YOUTUBE: ${{ secrets.BUFFER_CHANNEL_YOUTUBE }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          # This repo hosts its own rendered videos as Release assets, so the
          # token Actions already hands us is enough. No extra secret to create.
          VIDEO_HOST_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/doctor.js

      - name: Write, render and schedule
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_INSTAGRAM }}
          BUFFER_CHANNEL_TIKTOK: ${{ secrets.BUFFER_CHANNEL_TIKTOK }}
          BUFFER_CHANNEL_YOUTUBE: ${{ secrets.BUFFER_CHANNEL_YOUTUBE }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          # This repo hosts its own rendered videos as Release assets, so the
          # token Actions already hands us is enough. No extra secret to create.
          VIDEO_HOST_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          PROFILE_LINK: ${{ vars.PROFILE_LINK }}
          SONGS_DIR: ${{ runner.temp }}/songs
          SONG_START_SEC: "0"
          FORCE_RUN: ${{ inputs.force }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node scripts/main.js

      - name: Remember what was used
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each path on its own. `git add a b c` fails on the WHOLE list if
          # any one path is missing, staging nothing — and with `|| true` after
          # it, silently. assets/music/CREDITS.md stopped existing when the
          # music source changed, so state.json went unsaved for eight days and
          # the duplicate guard never had anything to read.
          for f in state.json content/ledger.json assets/music/index.json; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "Day scheduled $(TZ=Asia/Jerusalem date +%Y-%m-%d)"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true


